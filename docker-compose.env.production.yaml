version: "3.9"
networks:
  app_network:
    driver: bridge
services:
  my-node:
    container_name: nginx_env_production_popeyes
    ports:
      - 3991:3000
    build:
      context: ./StackFrontend
      dockerfile: nginx.env.production.Dockerfile
    volumes:
      - ./nginx/default.env.production.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app_network
